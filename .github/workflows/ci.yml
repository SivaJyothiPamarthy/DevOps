name: orders-service CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-north-1
  IMAGE_NAME: orders-service
  # Deploy jobs only run once the repo variable AWS_ACCOUNT_ID is set
  # (Settings → Secrets and variables → Actions → Variables).
  DEPLOY_ENABLED: ${{ vars.AWS_ACCOUNT_ID != '' }}

jobs:
  # ---------------------------------------------------------------- CI
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solution/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solution/app/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  scripting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - run: pytest -q scripting
      - name: shellcheck
        run: shellcheck scripting/**/*.sh

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and schema-validate manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for env in staging production; do
            kubectl kustomize solution/k8s/overlays/$env > /tmp/$env.yaml
            ./kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/$env.yaml
          done

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: terraform fmt -check -recursive solution/terraform
      - name: validate
        run: |
          for dir in bootstrap envs/staging envs/production; do
            terraform -chdir=solution/terraform/$dir init -backend=false -input=false
            terraform -chdir=solution/terraform/$dir validate
          done

  build-scan:
    runs-on: ubuntu-latest
    needs: [lint-test]
    permissions:
      contents: read
      id-token: write # OIDC to AWS, no stored keys
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: solution/app
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs -XPOST localhost:8080/api/v1/orders -H 'content-type: application/json' -d '{"item":"fika","amount_sek":42}'
          docker rm -f smoke
      - name: Scan image (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fikapay-staging-ci-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Push to ECR (tag = git SHA, immutable)
        if: github.ref == 'refs/heads/main' && env.DEPLOY_ENABLED == 'true'
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          docker tag ${{ env.IMAGE_NAME }}:ci ${{ steps.meta.outputs.image }}
          docker push ${{ steps.meta.outputs.image }}

  # ---------------------------------------------------------------- CD
  deploy-staging:
    if: github.ref == 'refs/heads/main' && vars.AWS_ACCOUNT_ID != ''
    needs: [build-scan, k8s-validate, terraform-validate]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          env: staging
          image: ${{ needs.build-scan.outputs.image }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}

  deploy-production:
    if: github.ref == 'refs/heads/main' && vars.AWS_ACCOUNT_ID != ''
    needs: [build-scan, deploy-staging]
    runs-on: ubuntu-latest
    # Manual approval: configure "Required reviewers" on the production environment
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          env: production
          image: ${{ needs.build-scan.outputs.image }}
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
